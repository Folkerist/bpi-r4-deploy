# Home Assistant + Matter Server + Zigbee2MQTT/Mosquitto on the BPI-R4 Pro (OpenWrt + dockerd, data on /mnt/nvme).
# All use the host network: HA needs mDNS/SSDP discovery, Matter needs IPv6 link-local on the LAN.
# Ports are not exposed to the Internet: fw4 rejects input from the wan zone.
services:
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /mnt/nvme/homeassistant/config:/config
    depends_on:
      - matter-server
      - mosquitto

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    network_mode: host
    restart: unless-stopped
    command: --storage-path /data --paa-root-cert-dir /data/credentials --primary-interface br-lan
    volumes:
      - /mnt/nvme/matter-server/data:/data

  # MQTT broker for Zigbee2MQTT <-> HA. Listens on 127.0.0.1 only (see mosquitto/mosquitto.conf).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    network_mode: host
    restart: unless-stopped
    volumes:
      - /mnt/nvme/mosquitto/config:/mosquitto/config
      - /mnt/nvme/mosquitto/data:/mosquitto/data

  # Zigbee: SONOFF ZBDongle-E V2 (EFR32MG21) -> /dev/ttyACM0 (cdc_acm, needs kmod-usb-acm; ttyUSB0-3 are the modem).
  # /dev + cgroup rule (166 = ttyACM) instead of `devices:` so the container starts with the dongle unplugged
  # and sees a replug. Frontend: http://<router>:8099
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /mnt/nvme/zigbee2mqtt/data:/app/data
      - /dev:/dev
    device_cgroup_rules:
      - 'c 166:* rmw'
    depends_on:
      - mosquitto

  # Cameras: Xiaomi C700 (chuangmi.camera.81ac1) via go2rtc's xiaomi source -> rtsp://127.0.0.1:8554/<name>.
  # Web UI http://<router>:1985 (LAN only; fw4 rejects wan input).
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /mnt/nvme/go2rtc:/config
