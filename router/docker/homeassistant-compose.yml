# Home Assistant + Matter Server on the BPI-R4 Pro (OpenWrt + dockerd, data on /mnt/nvme).
# Both use the host network: HA needs mDNS/SSDP discovery, Matter needs IPv6 link-local on the LAN.
# Ports are not exposed to the Internet: fw4 rejects input from the wan zone.
services:
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /mnt/nvme/homeassistant/config:/config
      # Zigbee: SONOFF ZBDongle-E V2 → /dev/ttyACM0 (cdc_acm, needs kmod-usb-acm; ttyUSB0-3 are the modem).
      # /dev + cgroup rule instead of `devices:` so HA still starts with the dongle unplugged and sees a replug.
      - /dev:/dev
    device_cgroup_rules:
      - 'c 166:* rmw'
    depends_on:
      - matter-server

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    network_mode: host
    restart: unless-stopped
    command: --storage-path /data --paa-root-cert-dir /data/credentials --primary-interface br-lan
    volumes:
      - /mnt/nvme/matter-server/data:/data
