# Local-only broker: HA and Zigbee2MQTT share the host network, so no auth is needed on 127.0.0.1.
# To let LAN devices (ESPHome, Tasmota) in, add a LAN listener with a password_file instead.
listener 1883 127.0.0.1
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
