# Помощники для «Планировки». На роутере: /config/input_select.yaml,
# в configuration.yaml — «input_select: !include input_select.yaml» (после добавления — перезапуск HA).

# Кто убирает комнату по долгому нажатию на плане и по кнопкам «Уборка» (script.fp_vacuum_clean).
# «Вместе» — сначала S5 пылесосит, потом Qrevo моет (script.fp_vacuum_together).
fp_vacuum:
  name: Кто убирает
  icon: mdi:robot-vacuum
  options: [Qrevo, S5, Вместе]
