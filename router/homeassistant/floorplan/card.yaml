            style: {left: 72.4%, top: 24.9%, width: 21.4%, height: 26.1%}
          - type: image
            image: /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [8], repeat: 1}]
              confirmation: {text: "Пылесос: убрать детскую?"}
            style: {left: 39.9%, top: 24.9%, width: 20.2%, height: 26.1%}
          # Значки: лампы, люстра и подсветка по периметру.
