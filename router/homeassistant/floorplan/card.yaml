              confirmation: {text: "Пылесос: убрать прихожую?"}
            style: {left: 57.2%, top: 71.5%, width: 8.1%, height: 13.9%}
          - type: image
            entity: switch.light_entry_main
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [7], repeat: 1}]
              confirmation: {text: "Пылесос: убрать прихожую?"}
            style: {left: 57.2%, top: 84.8%, width: 8.1%, height: 12.7%}
          - type: image
            entity: switch.light_wc
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 50.4%, top: 84.8%, width: 5.7%, height: 12.7%}
          - type: image
            entity: switch.light_storage
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 43.1%, top: 84.8%, width: 8.9%, height: 12.7%}
          - type: image
            entity: switch.light_kitchen_perimeter
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [1], repeat: 1}]
              confirmation: {text: "Пылесос: убрать кухню?"}
            style: {left: 27.9%, top: 77.8%, width: 21.8%, height: 26.6%}
          - type: image
            entity: switch.light_kitchen_main
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 33%, top: 83.5%, width: 8.1%, height: 12.7%}
          - type: image
            entity: light.zal_yeelight_hall
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [5], repeat: 1}]
              confirmation: {text: "Пылесос: убрать зал?"}
            style: {left: 35.9%, top: 51.3%, width: 28.2%, height: 26.6%}
          - type: image
            entity: light.spalnia_yeelight_bed
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
