# Панель «Карта»: Настройки → Панели → Карта → ✏️ → ⋮ → Редактор кода.
# SVG кладутся в /config/www/ → доступны как /local/...
# Нужен card-mod из HACS (иначе card_mod просто игнорируется).
# Светлая/тёмная версия переключается вместе с темой HA (dark_mode_image).
# После изменения SVG увеличивать ?v= у картинок (браузер кэширует /local/).
# Позиции в % от картинки: viewBox 80 465 440 395 (x% = (x-80)/4.4, y% = (y-465)/3.95).
views:
  - title: Карта
    path: map
    icon: mdi:floor-plan
    panel: true
    cards:
      - type: picture-elements
        image: /local/floorplan-light.svg?v=4
        dark_mode_image: /local/floorplan-dark.svg?v=4
        # card-mod (HACS): план целиком по высоте экрана; 1.114 = 440/395 — пропорции SVG.
        card_mod:
          style: |
            ha-card {
              max-width: calc((100vh - 72px) * 1.114);
              margin: 0 auto;
            }
        elements:
          # Подсветка комнаты, когда свет включён (на всю картинку, клики пропускает).
          - type: image
            entity: switch.light_bath
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-vannaia.svg?v=2
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_corridor
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-koridor.svg?v=2
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_hall_main
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-koridor-main.svg?v=2
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_hall_perimeter
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-koridor-perim.svg?v=2
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_entry_main
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-prikhozhaia-main.svg?v=2
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_entry_perimeter
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-prikhozhaia-perim.svg?v=2
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_wc
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-tualet.svg?v=2
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_storage
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-kladovka.svg?v=2
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_kitchen_perimeter
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-kukhnia-perim.svg?v=3
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          # Камера C700: поле зрения (статично) — на входную дверь.
          - type: image
            image: /local/fp-camera-fov.svg?v=1
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: light.zal_yeelight_hall
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-zal.svg?v=1
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: light.spalnia_yeelight_bed
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-spalnia.svg?v=1
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          # Нажатие на комнату — свет; долгое — пылесос убирает комнату (зал, кухня, спальня, прихожая, детская).
          - type: image
            entity: switch.light_kitchen_main
            image: /local/fp-empty.svg?v=2
            state_image:
              "on": /local/fp-light-kukhnia-main.svg?v=4
              "off": /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50%, top: 50%, width: 100%, pointer-events: none}
          - type: image
            entity: switch.light_bath
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 58.2%, top: 14.9%, width: 16.4%, height: 22.3%}
          - type: image
            entity: switch.light_corridor
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [2], repeat: 1}]
              confirmation: {text: "Пылесос: убрать малый коридор?"}
            style: {left: 58.2%, top: 32%, width: 16.4%, height: 11.9%}
          - type: image
            entity: switch.light_hall_main
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [6], repeat: 1}]
              confirmation: {text: "Пылесос: убрать коридор?"}
            style: {left: 58.2%, top: 51.3%, width: 16.4%, height: 26.6%}
          # Верх Г прихожей: левая часть (к кухне, кладовке, WC) = сегмент 3 «Коридор1», правая = 7 «Прихожая».
          - type: image
            entity: switch.light_entry_main
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [3], repeat: 1}]
              confirmation: {text: "Пылесос: убрать проход к кухне?"}
            style: {left: 44.3%, top: 71.5%, width: 20.5%, height: 13.9%}
          - type: image
            entity: switch.light_entry_main
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [7], repeat: 1}]
              confirmation: {text: "Пылесос: убрать прихожую?"}
            style: {left: 60.2%, top: 71.5%, width: 11.4%, height: 13.9%}
          - type: image
            entity: switch.light_entry_main
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [7], repeat: 1}]
              confirmation: {text: "Пылесос: убрать прихожую?"}
            style: {left: 60.2%, top: 84.8%, width: 11.4%, height: 12.7%}
          - type: image
            entity: switch.light_wc
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 50.6%, top: 84.8%, width: 8%, height: 12.7%}
          - type: image
            entity: switch.light_storage
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 40.3%, top: 84.8%, width: 12.5%, height: 12.7%}
          - type: image
            entity: switch.light_kitchen_perimeter
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [1], repeat: 1}]
              confirmation: {text: "Пылесос: убрать кухню?"}
            style: {left: 18.8%, top: 77.8%, width: 30.7%, height: 26.6%}
          - type: image
            entity: switch.light_kitchen_main
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 26.1%, top: 83.5%, width: 11.4%, height: 12.7%}
          - type: image
            entity: light.zal_yeelight_hall
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [5], repeat: 1}]
              confirmation: {text: "Пылесос: убрать зал?"}
            style: {left: 30.1%, top: 51.3%, width: 39.8%, height: 26.6%}
          - type: image
            entity: light.spalnia_yeelight_bed
            image: /local/fp-empty.svg?v=2
            tap_action: {action: toggle}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [4], repeat: 1}]
              confirmation: {text: "Пылесос: убрать спальню?"}
            style: {left: 81.5%, top: 24.9%, width: 30.2%, height: 26.1%}
          - type: image
            image: /local/fp-empty.svg?v=2
            tap_action: {action: none}
            hold_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [8], repeat: 1}]
              confirmation: {text: "Пылесос: убрать детскую?"}
            style: {left: 35.8%, top: 24.9%, width: 28.4%, height: 26.1%}
          # Значки: лампы, люстра и подсветка по периметру.
          - type: state-icon
            entity: switch.light_bath
            icon: mdi:ceiling-light
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 58.2%, top: 9%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: switch.light_corridor
            icon: mdi:ceiling-light
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 58.2%, top: 30.1%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: switch.light_hall_main
            icon: mdi:chandelier
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 58.2%, top: 44.3%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: switch.light_hall_perimeter
            icon: mdi:led-strip-variant
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 58.2%, top: 59.5%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: switch.light_entry_perimeter
            icon: mdi:led-strip-variant
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 46.6%, top: 70.1%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: switch.light_wc
            icon: mdi:toilet
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 50.5%, top: 83.3%, --mdc-icon-size: 28px}
          - type: state-icon
            entity: switch.light_entry_main
            icon: mdi:chandelier
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 60.2%, top: 70.9%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: switch.light_storage
            icon: mdi:ceiling-light
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 40.2%, top: 83.3%, --mdc-icon-size: 28px}
          - type: state-icon
            entity: switch.light_kitchen_main
            icon: mdi:chandelier
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 26.1%, top: 83.5%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: switch.light_kitchen_perimeter
            icon: mdi:led-strip-variant
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 11.4%, top: 84.8%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: camera.c700
            icon: mdi:cctv
            tap_action: {action: more-info}
            style: {left: 58.2%, top: 36.5%, --mdc-icon-size: 28px, color: "#4fc3f7"}
          - type: state-icon
            entity: light.zal_yeelight_hall
            icon: mdi:ceiling-light
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 30.1%, top: 44.3%, --mdc-icon-size: 36px}
          - type: state-icon
            entity: light.spalnia_yeelight_bed
            icon: mdi:ceiling-light
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 81.4%, top: 19%, --mdc-icon-size: 36px}
          # Пылесос Roborock Qrevo: база на кухне; цвет значка = состояние, нажатие — управление.
          - type: state-icon
            entity: vacuum.koridor_roborock_qrevo
            icon: mdi:robot-vacuum
            tap_action: {action: more-info}
            style: {left: 31.8%, top: 76.7%, --mdc-icon-size: 30px}
          # Климат: температура и влажность под названием комнаты, нажатие — график.
          - type: state-label
            entity: sensor.zal_temperature
            prefix: "🌡 "
            tap_action: {action: more-info}
            style: {left: 26.5%, top: 56.5%, color: var(--primary-text-color), font-size: 15px, opacity: 0.85}
          - type: state-label
            entity: sensor.zal_humidity
            prefix: "💧 "
            tap_action: {action: more-info}
            style: {left: 35.5%, top: 56.5%, color: var(--primary-text-color), font-size: 15px, opacity: 0.85}
          - type: state-label
            entity: sensor.koridor_temperature
            prefix: "🌡 "
            tap_action: {action: more-info}
            style: {left: 55%, top: 54.7%, color: var(--primary-text-color), font-size: 12px, opacity: 0.85}
          - type: state-label
            entity: sensor.koridor_humidity
            prefix: "💧 "
            tap_action: {action: more-info}
            style: {left: 61.4%, top: 54.7%, color: var(--primary-text-color), font-size: 12px, opacity: 0.85}
          - type: state-label
            entity: sensor.detskaia_temperature
            prefix: "🌡 "
            tap_action: {action: more-info}
            style: {left: 32.3%, top: 29.1%, color: var(--primary-text-color), font-size: 15px, opacity: 0.85}
          - type: state-label
            entity: sensor.detskaia_humidity
            prefix: "💧 "
            tap_action: {action: more-info}
            style: {left: 39.1%, top: 29.1%, color: var(--primary-text-color), font-size: 15px, opacity: 0.85}
          - type: state-label
            entity: sensor.kukhnia_temperature
            prefix: "🌡 "
            tap_action: {action: more-info}
            style: {left: 11.8%, top: 79.2%, color: var(--primary-text-color), font-size: 14px, opacity: 0.85}
          - type: state-label
            entity: sensor.kukhnia_humidity
            prefix: "💧 "
            tap_action: {action: more-info}
            style: {left: 18.2%, top: 79.2%, color: var(--primary-text-color), font-size: 14px, opacity: 0.85}
          - type: state-label
            entity: sensor.vannaia_temperature
            prefix: "🌡 "
            tap_action: {action: more-info}
            style: {left: 55.2%, top: 18.2%, color: var(--primary-text-color), font-size: 12px, opacity: 0.85}
          - type: state-label
            entity: sensor.vannaia_humidity
            prefix: "💧 "
            tap_action: {action: more-info}
            style: {left: 61.4%, top: 18.2%, color: var(--primary-text-color), font-size: 12px, opacity: 0.85}
          - type: state-label
            entity: sensor.spalnia_temperature
            prefix: "🌡 "
            tap_action: {action: more-info}
            style: {left: 78%, top: 29.1%, color: var(--primary-text-color), font-size: 15px, opacity: 0.85}
          - type: state-label
            entity: sensor.spalnia_humidity
            prefix: "💧 "
            tap_action: {action: more-info}
            style: {left: 84.8%, top: 29.1%, color: var(--primary-text-color), font-size: 15px, opacity: 0.85}
  - title: Камера
    path: camera
    icon: mdi:cctv
    panel: true
    cards:
      - type: picture-entity
        entity: camera.c700
        name: Прихожая
        camera_view: live
        tap_action: {action: more-info}
  - title: Пылесос
    path: vacuum
    icon: mdi:robot-vacuum
    cards:
      - type: tile
        entity: vacuum.koridor_roborock_qrevo
        name: Roborock Qrevo
        features_position: bottom
        features:
          - type: vacuum-commands
            commands: [start_pause, stop, return_home, locate]
      - type: glance
        show_name: true
        entities:
          - entity: sensor.koridor_roborock_qrevo_battery
            name: Заряд
          - entity: sensor.koridor_roborock_qrevo_status
            name: Статус
          - entity: sensor.koridor_roborock_qrevo_current_room
            name: Комната
          - entity: sensor.koridor_roborock_qrevo_cleaning_progress
            name: Прогресс
      - type: entities
        title: Режимы
        entities:
          - entity: select.koridor_roborock_qrevo_cleaning_mode
            name: Режим уборки
          - entity: select.koridor_roborock_qrevo_mop_mode
            name: Режим швабры
          - entity: select.koridor_roborock_qrevo_mop_intensity
            name: Подача воды
      # Уборка по комнатам: номера сегментов из roborock.get_maps (имена в приложении Roborock:
      # 1 Кухня, 2 Коридор3 = малый коридор у ванной, 3 Коридор1 = проход от прихожей к кухне, 4 Главная спальня,
      # 5 Зал, 6 Коридор = основной, 7 Прихожая, 8 Лекс = детская). Номера в приложении — другие (порядок показа).
      - type: grid
        title: Убрать комнату
        columns: 4
        square: false
        cards:
          - type: button
            name: Зал
            icon: mdi:sofa
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [5], repeat: 1}]
              confirmation: {text: "Убрать: Зал?"}
          - type: button
            name: Кухня
            icon: mdi:stove
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [1], repeat: 1}]
              confirmation: {text: "Убрать: Кухня?"}
          - type: button
            name: Спальня
            icon: mdi:bed-king
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [4], repeat: 1}]
              confirmation: {text: "Убрать: Спальня?"}
          - type: button
            name: Детская (Лекс)
            icon: mdi:teddy-bear
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [8], repeat: 1}]
              confirmation: {text: "Убрать: Детская (Лекс)?"}
          - type: button
            name: Прихожая
            icon: mdi:door
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [7], repeat: 1}]
              confirmation: {text: "Убрать: Прихожая?"}
          - type: button
            name: Коридор
            icon: mdi:walk
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [6], repeat: 1}]
