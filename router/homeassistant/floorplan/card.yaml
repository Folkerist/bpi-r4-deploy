# Панель «Карта»: Настройки → Панели → Карта → ✏️ → ⋮ → Редактор кода.
# SVG кладутся в /config/www/ → доступны как /local/...
# Нужен card-mod из HACS (иначе card_mod просто игнорируется).
# Светлая/тёмная версия переключается вместе с темой HA (dark_mode_image).
# После изменения SVG увеличивать ?v= у картинок (браузер кэширует /local/).
# Позиции в % от картинки: viewBox -10 465 620 395 (x% = (x+10)/6.2, y% = (y-465)/3.95); план — x 80..520,
# оверлеи комнат (свой viewBox 80 465 440 395) ставятся по центру шириной 70.97%. Слева/справа — боковые панели.
views:
  - title: Карта
    path: map
    icon: mdi:floor-plan
    panel: true
    cards:
      # BEGIN map (генерирует gen-card.py из map-desktop.yaml — не править вручную)
      - type: vertical-stack
        cards:
          # Компьютер / планшет / телефон боком.
          - type: conditional
            conditions: [{condition: screen, media_query: "(min-width: 768px)"}]
            card:
              type: picture-elements
              image: /local/floorplan-light.svg?v=9
              dark_mode_image: /local/floorplan-dark.svg?v=9
              # card-mod (HACS): план целиком по высоте экрана; 1.114 = 440/395 — пропорции SVG.
              card_mod:
                style: |
                  ha-card {
                    max-width: calc((100vh - 72px) * 1.57);
                    margin: 0 auto;
                  }
              elements:
                # Подсветка комнаты, когда свет включён (на всю картинку, клики пропускает).
                - type: image
                  entity: switch.light_bath
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-vannaia.svg?v=2
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_corridor
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-koridor.svg?v=2
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_hall_main
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-koridor-main.svg?v=2
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_hall_perimeter
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-koridor-perim.svg?v=2
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_entry_main
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-prikhozhaia-main.svg?v=2
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_entry_perimeter
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-prikhozhaia-perim.svg?v=2
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_wc
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-tualet.svg?v=2
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_storage
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-kladovka.svg?v=2
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_kitchen_perimeter
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-kukhnia-perim.svg?v=3
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                # Движение (датчики Xiaomi): пульсирующая голубая рамка комнаты; на кухне ещё кольцо у стола.
                - type: image
                  entity: binary_sensor.kukhnia_motion
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-motion-kukhnia.svg?v=1
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: binary_sensor.kukhnia_stol_motion
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-motion-kukhnia-stol.svg?v=1
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: binary_sensor.vannaia_motion
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-motion-vannaia.svg?v=1
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: binary_sensor.koridor_motion
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-motion-koridor.svg?v=1
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: binary_sensor.tualet_motion
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-motion-tualet.svg?v=1
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: binary_sensor.prikhozhaia_motion
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-motion-prikhozhaia.svg?v=1
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                # Камера C700: поле зрения (статично) — на входную дверь.
                - type: image
                  image: /local/fp-camera-fov.svg?v=1
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                # Входная дверь открыта — красная створка (время — подписью у двери, ниже).
                - type: image
                  entity: binary_sensor.e4aaec6dff8c_contact
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-door-open.svg?v=1
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                # Пылесос: комната, которую убирает сейчас (sensor.fp_vacuum_room — templates.yaml), зелёная.
                - type: image
                  entity: sensor.fp_vacuum_room
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    kukhnia: /local/fp-vac-kukhnia.svg?v=1
                    koridor2: /local/fp-vac-koridor2.svg?v=1
                    prokhod: /local/fp-vac-prokhod.svg?v=1
                    spalnia: /local/fp-vac-spalnia.svg?v=1
                    zal: /local/fp-vac-zal.svg?v=1
                    koridor: /local/fp-vac-koridor.svg?v=1
                    prikhozhaia: /local/fp-vac-prikhozhaia.svg?v=1
                    detskaia: /local/fp-vac-detskaia.svg?v=1
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                # Второй пылесос (Roborock S5): его комната — фиолетовая (sensor.fp_vacuum2_room — templates.yaml).
                - type: image
                  entity: sensor.fp_vacuum2_room
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    kukhnia: /local/fp-vac2-kukhnia.svg?v=1
                    koridor2: /local/fp-vac2-koridor2.svg?v=1
                    prokhod: /local/fp-vac2-prokhod.svg?v=1
                    spalnia: /local/fp-vac2-spalnia.svg?v=1
                    zal: /local/fp-vac2-zal.svg?v=1
                    koridor: /local/fp-vac2-koridor.svg?v=1
                    prikhozhaia: /local/fp-vac2-prikhozhaia.svg?v=1
                    detskaia: /local/fp-vac2-detskaia.svg?v=1
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                # Яндекс Станции играют: розовые волны вокруг колонки (значки и подписи — ниже).
                - type: conditional
                  conditions: [{entity: media_player.yandex_station_u0086h0002ec9r, state: playing}]
                  elements:
                    - {type: image, image: "/local/fp-play-u0086h0002ec9r.svg?v=1", tap_action: {action: none}, hold_action: {action: none},
                       style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}}
                - type: conditional
                  conditions: [{entity: media_player.yandex_tv_t60jcw202w4z1k, state: playing}]
                  elements:
                    - {type: image, image: "/local/fp-play-t60jcw202w4z1k.svg?v=1", tap_action: {action: none}, hold_action: {action: none},
                       style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}}
                - type: conditional
                  conditions: [{entity: media_player.yandex_station_x11bmg2000x29z, state: playing}]
                  elements:
                    - {type: image, image: "/local/fp-play-x11bmg2000x29z.svg?v=1", tap_action: {action: none}, hold_action: {action: none},
                       style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}}
                - type: conditional
                  conditions: [{entity: media_player.yandex_station_m104q81001k74k, state: playing}]
                  elements:
                    - {type: image, image: "/local/fp-play-m104q81001k74k.svg?v=1", tap_action: {action: none}, hold_action: {action: none},
                       style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}}
                - type: conditional
                  conditions: [{entity: media_player.yandex_station_lp00000000000047571100008ab064b1, state: playing}]
                  elements:
                    - {type: image, image: "/local/fp-play-lp00000000000047571100008ab064b1.svg?v=1", tap_action: {action: none}, hold_action: {action: none},
                       style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}}
                - type: conditional
                  conditions: [{entity: media_player.yandex_station_r10cv31007wqfn, state: playing}]
                  elements:
                    - {type: image, image: "/local/fp-play-r10cv31007wqfn.svg?v=1", tap_action: {action: none}, hold_action: {action: none},
                       style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}}
                - type: image
                  entity: light.zal_yeelight_hall
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-zal.svg?v=1
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: light.spalnia_yeelight_bed
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-spalnia.svg?v=1
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                # Нажатие на комнату — свет; долгое — уборка комнаты пылесосом с переключателя «Кто убирает» (script.fp_vacuum_clean).
                - type: image
                  entity: switch.light_kitchen_main
                  image: /local/fp-empty.svg?v=2
                  state_image:
                    "on": /local/fp-light-kukhnia-main.svg?v=4
                    "off": /local/fp-empty.svg?v=2
                  tap_action: {action: none}
                  hold_action: {action: none}
                  style: {left: 50%, top: 50%, width: 70.97%, pointer-events: none}
                - type: image
                  entity: switch.light_bath
                  image: /local/fp-empty.svg?v=2
                  tap_action: {action: toggle}
                  hold_action: {action: more-info}
                  style: {left: 55.8%, top: 14.9%, width: 11.6%, height: 22.3%}
                - type: image
                  entity: switch.light_corridor
                  image: /local/fp-empty.svg?v=2
                  tap_action: {action: toggle}
                  hold_action:
                    action: perform-action
                    perform_action: script.fp_vacuum_clean
                    data: {rooms: koridor2}
                    confirmation: {text: "Пылесос: убрать малый коридор?"}
                  style: {left: 55.8%, top: 32%, width: 11.6%, height: 11.9%}
                - type: image
