  - title: Камера
    path: camera
    icon: mdi:cctv
    panel: true
    cards:
      - type: picture-entity
        entity: camera.c700
        name: Прихожая
        camera_view: live
        tap_action: {action: more-info}
  - title: Пылесос
    path: vacuum
    icon: mdi:robot-vacuum
    cards:
      - type: tile
        entity: vacuum.koridor_roborock_qrevo
        name: Roborock Qrevo
        features_position: bottom
        features:
          - type: vacuum-commands
            commands: [start_pause, stop, return_home, locate]
      - type: glance
        show_name: true
        entities:
          - entity: sensor.koridor_roborock_qrevo_battery
            name: Заряд
          - entity: sensor.koridor_roborock_qrevo_status
            name: Статус
          - entity: sensor.koridor_roborock_qrevo_current_room
            name: Комната
          - entity: sensor.koridor_roborock_qrevo_cleaning_progress
            name: Прогресс
      - type: entities
        title: Режимы
        entities:
          - entity: select.koridor_roborock_qrevo_cleaning_mode
            name: Режим уборки
          - entity: select.koridor_roborock_qrevo_mop_mode
            name: Режим швабры
          - entity: select.koridor_roborock_qrevo_mop_intensity
            name: Подача воды
      # Уборка по комнатам: номера сегментов из roborock.get_maps (имена в приложении Roborock:
      # 1 Кухня, 2 Коридор3 = малый коридор у ванной, 3 Коридор1 = проход от прихожей к кухне, 4 Главная спальня,
      # 5 Зал, 6 Коридор = основной, 7 Прихожая, 8 Лекс = детская). Номера в приложении — другие (порядок показа).
      - type: grid
        title: Убрать комнату
        columns: 4
        square: false
        cards:
          - type: button
            name: Зал
            icon: mdi:sofa
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [5], repeat: 1}]
              confirmation: {text: "Убрать: Зал?"}
          - type: button
            name: Кухня
            icon: mdi:stove
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [1], repeat: 1}]
              confirmation: {text: "Убрать: Кухня?"}
          - type: button
            name: Спальня
            icon: mdi:bed-king
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [4], repeat: 1}]
              confirmation: {text: "Убрать: Спальня?"}
          - type: button
            name: Детская (Лекс)
            icon: mdi:teddy-bear
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [8], repeat: 1}]
              confirmation: {text: "Убрать: Детская (Лекс)?"}
          - type: button
            name: Прихожая
            icon: mdi:door
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [7], repeat: 1}]
              confirmation: {text: "Убрать: Прихожая?"}
          - type: button
            name: Коридор
            icon: mdi:walk
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [6], repeat: 1}]
              confirmation: {text: "Убрать: Коридор?"}
          - type: button
            name: Проход к кухне
            icon: mdi:walk
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [3], repeat: 1}]
              confirmation: {text: "Убрать: Проход к кухне?"}
          - type: button
            name: Малый коридор
            icon: mdi:walk
            tap_action:
              action: perform-action
              perform_action: vacuum.send_command
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              data:
                command: app_segment_clean
                params: [{segments: [2], repeat: 1}]
              confirmation: {text: "Убрать: Малый коридор?"}
      - type: picture-entity
        entity: image.koridor_roborock_qrevo_map_0
        name: Карта пылесоса
        show_state: false
  - title: Погода
    path: weather
    icon: mdi:weather-partly-cloudy
    cards:
      - type: weather-forecast
        entity: weather.forecast_home_assistant
        forecast_type: hourly
        show_current: true
        show_forecast: true
      - type: weather-forecast
        entity: weather.forecast_home_assistant
        forecast_type: daily
        show_current: false
        show_forecast: true
