                  entity: vacuum.koridor_roborock_qrevo
                  icon: mdi:robot-vacuum
                  tap_action: {action: more-info}
                  style: {left: 37.1%, top: 76.7%, --mdc-icon-size: 30px}
                # Второй пылесос Roborock S5: база рядом с Qrevo (по карте Map Extractor — у правой стены кухни).
                - type: state-icon
                  entity: vacuum.roborock_s5_8159_robot_cleaner
                  icon: mdi:robot-vacuum-variant
                  tap_action: {action: more-info}
