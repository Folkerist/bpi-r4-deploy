  - title: Камера
    path: camera
    icon: mdi:cctv
    panel: true
    cards:
      - type: picture-entity
        entity: camera.c700
        name: Прихожая
        camera_view: live
        tap_action: {action: more-info}
  - title: Пылесос
    path: vacuum
    icon: mdi:robot-vacuum
    cards:
      - type: tile
        entity: vacuum.koridor_roborock_qrevo
        name: Мокрый (Qrevo)
        features_position: bottom
        features:
          - type: vacuum-commands
            commands: [start_pause, stop, return_home, locate]
      - type: glance
        show_name: true
        entities:
          - entity: sensor.koridor_roborock_qrevo_battery
            name: Заряд
          - entity: sensor.koridor_roborock_qrevo_status
            name: Статус
          - entity: sensor.koridor_roborock_qrevo_current_room
            name: Комната
          - entity: sensor.koridor_roborock_qrevo_cleaning_progress
            name: Прогресс
      - type: entities
        title: Режимы
        entities:
          - entity: select.koridor_roborock_qrevo_cleaning_mode
            name: Режим уборки
          - entity: select.koridor_roborock_qrevo_mop_mode
            name: Режим швабры
          - entity: select.koridor_roborock_qrevo_mop_intensity
            name: Подача воды
      # Второй пылесос: Roborock S5 (Xiaomi Miot, только сухая уборка), карта — Xiaomi Cloud Map Extractor.
      - type: tile
        entity: vacuum.roborock_s5_8159_robot_cleaner
        name: Сухой (S5)
        features_position: bottom
        features:
          - type: vacuum-commands
            commands: [start_pause, stop, return_home, locate]
      - type: glance
        show_name: true
        entities:
          - entity: sensor.roborock_s5_8159_battery_level
            name: Заряд
          - entity: sensor.roborock_s5_8159_status
            name: Статус
          - entity: sensor.robot_pylesos_vacuum_room_id
            name: Сегмент
          - entity: select.roborock_s5_8159_mode
            name: Мощность
      # Кто убирает по кнопкам ниже и долгому нажатию на карте (input_select.fp_vacuum); «Вместе» — сначала сухой (S5), потом мокрый (Qrevo) моет.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_select.fp_vacuum
            name: Кто убирает
            features_position: bottom
            features: [{type: select-options}]
          - type: button
            name: Всё вместе
            icon: mdi:broom
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: {entity_id: script.fp_vacuum_together}
              confirmation: {text: "Вся квартира: сначала сухой пылесосит, потом мокрый моет?"}
      # Уборка по комнатам (script.fp_vacuum_clean, сегменты обоих пылесосов — в scripts.yaml). Qrevo (roborock.get_maps):
      # 1 Кухня, 2 Коридор3 = малый коридор у ванной, 3 Коридор1 = проход от прихожей к кухне, 4 Главная спальня,
      # 5 Зал, 6 Коридор = основной, 7 Прихожая, 8 Лекс = детская. Номера в приложении — другие (порядок показа).
      - type: grid
        title: Убрать комнату
        columns: 4
        square: false
        cards:
          - type: button
            name: Зал
            icon: mdi:sofa
            tap_action:
              action: perform-action
              perform_action: script.fp_vacuum_clean
              data: {rooms: zal}
              confirmation: {text: "Убрать: Зал?"}
          - type: button
            name: Кухня
            icon: mdi:stove
            tap_action:
              action: perform-action
              perform_action: script.fp_vacuum_clean
              data: {rooms: kukhnia}
              confirmation: {text: "Убрать: Кухня?"}
          - type: button
            name: Спальня
            icon: mdi:bed-king
            tap_action:
              action: perform-action
              perform_action: script.fp_vacuum_clean
              data: {rooms: spalnia}
              confirmation: {text: "Убрать: Спальня?"}
          - type: button
            name: Детская (Лекс)
            icon: mdi:teddy-bear
            tap_action:
              action: perform-action
              perform_action: script.fp_vacuum_clean
              data: {rooms: detskaia}
              confirmation: {text: "Убрать: Детская (Лекс)?"}
          - type: button
            name: Прихожая
            icon: mdi:door
            tap_action:
              action: perform-action
              perform_action: script.fp_vacuum_clean
              data: {rooms: prikhozhaia}
              confirmation: {text: "Убрать: Прихожая?"}
          - type: button
            name: Коридор
            icon: mdi:walk
            tap_action:
              action: perform-action
              perform_action: script.fp_vacuum_clean
              data: {rooms: koridor}
              confirmation: {text: "Убрать: Коридор?"}
          - type: button
            name: Проход к кухне
            icon: mdi:walk
            tap_action:
              action: perform-action
              perform_action: script.fp_vacuum_clean
              data: {rooms: prokhod}
              confirmation: {text: "Убрать: Проход к кухне?"}
          - type: button
            name: Малый коридор
            icon: mdi:walk
            tap_action:
              action: perform-action
              perform_action: script.fp_vacuum_clean
              data: {rooms: koridor2}
              confirmation: {text: "Убрать: Малый коридор?"}
      - type: picture-entity
        entity: image.koridor_roborock_qrevo_map_0
        name: Карта мокрого (Qrevo)
        show_state: false
      - type: picture-entity
        entity: image.robot_pylesos_live_map
        name: Карта сухого (S5)
        show_state: false
