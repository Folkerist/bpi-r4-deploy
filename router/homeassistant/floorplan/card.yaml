                    confirmation: {text: "Пылесос: убрать кухню?"}
                  style: {left: 27.9%, top: 77.8%, width: 21.8%, height: 26.6%}
                - type: image
                  entity: switch.light_kitchen_main
                  image: /local/fp-empty.svg?v=2
                  tap_action: {action: toggle}
