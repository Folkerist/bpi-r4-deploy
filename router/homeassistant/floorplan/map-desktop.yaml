      image: /local/weather/not-available.svg
      state_image:
        "clear-night": /local/weather/clear-night.svg
        "cloudy": /local/weather/cloudy.svg
        "exceptional": /local/weather/not-available.svg
        "fog": /local/weather/fog.svg
        "hail": /local/weather/hail.svg
        "lightning": /local/weather/thunderstorms.svg
        "lightning-rainy": /local/weather/thunderstorms-rain.svg
        "partlycloudy": /local/weather/partly-cloudy-day.svg
        "pouring": /local/weather/rain.svg
        "rainy": /local/weather/rain.svg
        "snowy": /local/weather/snow.svg
        "snowy-rainy": /local/weather/sleet.svg
        "sunny": /local/weather/clear-day.svg
        "windy": /local/weather/wind.svg
        "windy-variant": /local/weather/wind.svg
      tap_action: {action: more-info}
      style: {left: 89.7%, top: 13.2%, width: 5.5%}
    - type: state-label
      entity: weather.pavshino
      attribute: temperature
      suffix: " °C"
