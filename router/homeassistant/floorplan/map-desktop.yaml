    - type: image
      entity: camera.c700
      camera_image: camera.c700
      camera_view: auto
      tap_action: {action: more-info}
      style: {left: 92.7%, top: 31.6%, width: 11.94%, border-radius: 6px, overflow: hidden}
    - type: conditional
      conditions:
        - entity: binary_sensor.c700_motion
          state: "on"
      elements:
        - type: image
          image: /local/fp-camera-motion.svg?v=1
          tap_action: {action: none}
          style: {left: 92.7%, top: 31.6%, width: 12.9%, pointer-events: none}
