# Автоматизации HA. На роутере: /config/automations.yaml (в configuration.yaml — «automation: !include automations.yaml»).

# Уборка по голосу: «Алиса, убери в зале». Сценарии Яндекса «Уборка: <комната>» (создаются ya_create.py) по фразе
# запускают на услышавшей колонке беззвучную команду «ничего не делай» — интеграция yandex_station присылает событие
# yandex_scenario с именем сценария и колонкой. Пылесос — переключатель «Кто убирает»; сценарии «Сухая уборка: …» /
# «Мокрая уборка: …» (если создать) выбирают пылесос сами; «вся квартира» — сначала сухой, потом мокрый.
# Сценарии HA для TTS называются «ХА <id>» и сюда не попадают. Повторные события в течение 5 с — отбрасываются.
- id: fp_vacuum_voice
  alias: Уборка по голосу (Алиса)
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: event
      event_type: yandex_scenario
  conditions:
    - condition: template
      value_template: "{{ (trigger.event.data.scenario_name or '') is match('(Сухая |Мокрая )?[Уу]борка: ') }}"
  actions:
    - variables:
        rooms: {"зал": zal, "кухня": kukhnia, "спальня": spalnia, "детская": detskaia, "прихожая": prikhozhaia,
                "коридор": koridor, "малый коридор": koridor2, "проход к кухне": prokhod}
        say: {zal: зал, kukhnia: кухню, spalnia: спальню, detskaia: детскую, prikhozhaia: прихожую, koridor: коридор,
              koridor2: малый коридор, prokhod: проход к кухне}
        sname: "{{ trigger.event.data.scenario_name }}"
        place: "{{ sname.split(':', 1)[1] | trim | lower }}"
        room: "{{ 'all' if place == 'вся квартира' else rooms.get(place, '') }}"
        who: >
          {{ 'Сухой' if sname.startswith('Сухая') else 'Мокрый' if sname.startswith('Мокрая')
             else states('input_select.fp_vacuum') }}
        speaker: "{{ trigger.event.data.entity_id }}"
    - choose:
        - conditions: "{{ room == '' }}"
          sequence:
            - action: media_player.play_media
              target: {entity_id: "{{ speaker }}"}
              data: {media_content_type: text, media_content_id: "Не знаю такую комнату: {{ place }}"}
        - conditions: "{{ room == 'all' }}"
          sequence:
            - action: script.turn_on
              target: {entity_id: script.fp_vacuum_together}
            - action: media_player.play_media
              target: {entity_id: "{{ speaker }}"}
              data: {media_content_type: text, media_content_id: "Убираю всю квартиру: сначала сухой пылесос, потом мокрый"}
      default:
        - action: script.fp_vacuum_clean
          data: {rooms: "{{ room }}", who: "{{ who }}"}
        - action: media_player.play_media
          target: {entity_id: "{{ speaker }}"}
          data:
            media_content_type: text
            media_content_id: >
              Убираю {{ say[room] }}{{ ': сначала сухой пылесос, потом мокрый' if who == 'Вместе'
                                       else ', пылесос ' ~ who | lower }}
    - delay: "00:00:05"
