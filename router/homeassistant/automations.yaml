# Автоматизации HA. На роутере: /config/automations.yaml (в configuration.yaml — «automation: !include automations.yaml»).

# Уборка голосом, всё решает фраза (переключатель на карте не участвует):
#   «Алиса, пропылесось зал»  -> сценарий «Пылесось: зал» -> сухой (S5)
#   «Алиса, помой на кухне»   -> «Помой: кухня»           -> мокрый (Qrevo)
#   «Алиса, убери в спальне»  -> «Уборка: спальня»        -> сначала сухой, потом мокрый
#   «…всю квартиру» / «…везде» -> «…: вся квартира»;  «останови уборку» -> «Уборка: пауза» -> оба на паузу;
#   «пылесосы на базу» / «хватит убирать» -> «Уборка: стоп» -> оба на базу.
# Сценарии создаёт yandex/ya_create.py: по фразе услышавшая колонка выполняет беззвучное «ничего не делай», интеграция
# yandex_station присылает событие yandex_scenario с именем сценария и колонкой; ответ голосом — на той же колонке.
# Сценарии HA для TTS называются «ХА <id>» и сюда не попадают. Повторные события в течение 5 с — отбрасываются.
- id: fp_vacuum_voice
  alias: Уборка по голосу (Алиса)
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: event
      event_type: yandex_scenario
  conditions:
    - condition: template
      value_template: "{{ (trigger.event.data.scenario_name or '') is match('(Пылесось|Помой|Уборка): ') }}"
  actions:
    - variables:
        rooms: {"зал": zal, "кухня": kukhnia, "спальня": spalnia, "детская": detskaia, "прихожая": prikhozhaia,
                "коридор": koridor, "малый коридор": koridor2, "проход в коридоре": prokhod}
        say: {zal: зал, kukhnia: кухню, spalnia: спальню, detskaia: детскую, prikhozhaia: прихожую, koridor: коридор,
              koridor2: малый коридор, prokhod: проход в коридоре, all: всю квартиру}
        verb: "{{ trigger.event.data.scenario_name.split(':', 1)[0] }}"
        place: "{{ trigger.event.data.scenario_name.split(':', 1)[1] | trim | lower }}"
        room: >-
          {{ 'all' if place == 'вся квартира' else 'stop' if place == 'стоп' else 'pause' if place == 'пауза'
             else rooms.get(place, '') }}
        who: "{{ {'Пылесось': 'Сухой', 'Помой': 'Мокрый'}.get(verb, 'Вместе') }}"
        ids: "{{ rooms.values() | list if room == 'all' else [room] }}"
        speaker: "{{ trigger.event.data.entity_id }}"
    - choose:
        - conditions: "{{ room == 'stop' }}"
          sequence:
            - action: script.turn_off
              target: {entity_id: script.fp_vacuum_together}
            - action: vacuum.return_to_base
              target: {entity_id: [vacuum.roborock_s5_8159_robot_cleaner, vacuum.koridor_roborock_qrevo]}
            - action: media_player.play_media
              target: {entity_id: "{{ speaker }}"}
              data: {media_content_type: text, media_content_id: "Пылесосы едут на базу"}
        # Пауза: «Вместе» прерывается (иначе после паузы и возврата S5 на базу Qrevo начал бы мыть). Пауза на стоящем
        # пылесосе безвредна, а состояние S5 в HA запаздывает на ~20 с — поэтому без проверки состояния, ошибки не мешают.
        - conditions: "{{ room == 'pause' }}"
          sequence:
            - action: script.turn_off
              target: {entity_id: script.fp_vacuum_together}
            - action: vacuum.pause
              target: {entity_id: vacuum.roborock_s5_8159_robot_cleaner}
              continue_on_error: true
            - action: vacuum.pause
              target: {entity_id: vacuum.koridor_roborock_qrevo}
              continue_on_error: true
            - action: media_player.play_media
              target: {entity_id: "{{ speaker }}"}
              data: {media_content_type: text, media_content_id: "Ставлю уборку на паузу"}
        - conditions: "{{ room == '' }}"
          sequence:
            - action: media_player.play_media
              target: {entity_id: "{{ speaker }}"}
              data: {media_content_type: text, media_content_id: "Не знаю такую комнату: {{ place }}"}
      default:
        - if: "{{ who == 'Вместе' }}"
          then:
            - action: script.turn_on
              target: {entity_id: script.fp_vacuum_together}
              data: {variables: {rooms: "{{ ids }}"}}
          else:
            - action: script.fp_vacuum_clean
              data: {rooms: "{{ ids }}", who: "{{ who }}"}
        - action: media_player.play_media
          target: {entity_id: "{{ speaker }}"}
          data:
            media_content_type: text
            media_content_id: >
              {{ {'Сухой': 'Пылесошу ', 'Мокрый': 'Мою '}.get(who, 'Убираю ') ~ say[room] }}{{
                 ': сначала пылесос, потом мойка' if who == 'Вместе' else '' }}
    - delay: "00:00:05"
- id: motion_sensor_test_blink
  alias: Тест датчиков движения
  description: >-
    Режим проверки: каждый датчик движения на каждое событие моргает (2 раза) всем светом своей комнаты
    и возвращает как было. Кладовки нет — там свой автосвет. Включать вручную на время проверки.
  initial_state: false
  mode: parallel
  max: 20
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.kukhnia_motion
        - binary_sensor.kukhnia_stol_motion
        - binary_sensor.zal_motion
        - binary_sensor.koridor_motion
        - binary_sensor.prikhozhaia_motion
        - binary_sensor.prikhozhaia_vkhod_motion
        - binary_sensor.vannaia_motion
        - binary_sensor.tualet_motion
  # Без to/from: срабатывает и на повторные события датчика, пока он уже в «on».
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state == 'on'
           and trigger.from_state is not none
           and trigger.from_state.state not in ['unavailable', 'unknown'] }}
  variables:
    rooms:
      binary_sensor.kukhnia_motion: [switch.light_kitchen_perimeter]
      binary_sensor.kukhnia_stol_motion: [switch.light_kitchen_main]
      binary_sensor.zal_motion: [light.zal_yeelight_hall]
      binary_sensor.koridor_motion: [switch.light_corridor, switch.light_hall_main, switch.light_hall_perimeter]
      binary_sensor.prikhozhaia_motion: [switch.light_entry_main]
      binary_sensor.prikhozhaia_vkhod_motion: [switch.light_entry_perimeter]
      binary_sensor.vannaia_motion: [switch.light_bath]
      binary_sensor.tualet_motion: [switch.light_wc]
    target: "{{ rooms[trigger.entity_id] }}"
  actions:
    - repeat:
        count: 4
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: "{{ target }}"
          - delay: "00:00:01"
- id: low_battery_notify
  alias: Низкий заряд батареек
  description: >-
    Уведомление на телефон, когда у датчика заряд ниже 15% (сразу при падении и сводкой каждый день в 10:00).
    Новый датчик с батарейкой — добавить в оба списка ниже. Телефон, планшет и пылесосы не учитываются.
  mode: queued
  triggers:
    - trigger: numeric_state
      id: drop
      below: 15
      entity_id: &batteries
        - sensor.spalnia_battery
        - sensor.zal_battery
        - sensor.koridor_battery
        - sensor.vannaia_battery
        - sensor.detskaia_battery
        - sensor.kukhnia_battery
        - sensor.prikhozhaia_dver_battery
        - sensor.kladovka_dver_battery
        - sensor.vannaia_dver_battery
        - sensor.kladovka_motion_battery
        - sensor.koridor_motion_battery
        - sensor.kukhnia_motion_battery
        - sensor.kukhnia_stol_motion_battery
        - sensor.prikhozhaia_motion_battery
        - sensor.prikhozhaia_vkhod_motion_battery
        - sensor.tualet_motion_battery
        - sensor.vannaia_motion_battery
        - sensor.zal_motion_battery
    - trigger: time
      id: daily
      at: "10:00:00"
  variables:
    batteries: *batteries
    low: >-
      {% set ns = namespace(items=[]) %}
      {% for e in batteries if states(e) | is_number and states(e) | float < 15 %}
        {% set ns.items = ns.items + [state_attr(e, 'friendly_name') ~ ': ' ~ (states(e) | float | round(0) | int) ~ '%'] %}
      {% endfor %}
      {{ ns.items }}
  conditions:
    - condition: template
      value_template: "{{ trigger.id | default('') == 'drop' or low | count > 0 }}"
  actions:
    - action: notify.mobile_app_vivo_x200
      data:
        title: "🔋 Пора менять батарейку"
        message: >-
          {% if trigger.id | default('') == 'drop' %}{{ trigger.to_state.name }}: {{ trigger.to_state.state | float | round(0) | int }}%
          {% else %}Низкий заряд: {{ low | join(', ') if low | count > 0 else 'всё в порядке' }}{% endif %}
        data:
          tag: low-battery
          channel: Батарейки
- id: kladovka_light_by_door
  alias: 'Кладовка: свет по двери и движению'
  description: >-
    Дверь открыли — свет вкл. Движение в кладовке — свет вкл (и отменяет выключение).
    Дверь закрыли — через 40 с выкл, если за это время внутри нет движения.
    Свет выключается и после 15 минут подряд без движения (отсчёт от последнего движения).
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.kladovka_dver_contact
      from: "off"
      to: "on"
      id: door_open
    - trigger: state
      entity_id: binary_sensor.kladovka_dver_contact
      from: "on"
      to: "off"
      id: door_closed
    # Без to/from: срабатывает и на повторные события датчика, пока он уже в «on».
    - trigger: state
      entity_id: binary_sensor.kladovka_motion
      id: motion
    - trigger: state
      entity_id: binary_sensor.kladovka_motion
      to: "off"
      for: "00:15:00"
      id: quiet
    - trigger: state
      entity_id: binary_sensor.kladovka_dver_contact
      to: "on"
      for: "00:15:00"
      id: quiet
  conditions:
    - condition: template
      value_template: >-
        {% if trigger.id == 'motion' %}
          {{ trigger.to_state is not none and trigger.to_state.state == 'on'
             and trigger.from_state is not none
             and trigger.from_state.state not in ['unavailable', 'unknown'] }}
        {% elif trigger.id == 'quiet' %}
          {{ is_state('switch.light_storage', 'on') and is_state('binary_sensor.kladovka_motion', 'off')
             and (now() - states.binary_sensor.kladovka_motion.last_changed).total_seconds() >= 900 }}
        {% else %}true{% endif %}
  actions:
    - choose:
        - conditions: [{condition: trigger, id: [door_open, motion]}]
          sequence:
            - action: switch.turn_on
              target: {entity_id: switch.light_storage}
        - conditions: [{condition: trigger, id: door_closed}]
          sequence:
            # Новое движение за эти 40 с перезапустит автоматизацию (mode: restart) и отменит выключение.
            - delay: "00:00:40"
            - action: switch.turn_off
              target: {entity_id: switch.light_storage}
        - conditions: [{condition: trigger, id: quiet}]
          sequence:
            - action: switch.turn_off
              target: {entity_id: switch.light_storage}
- id: auto_off_no_motion
  alias: 'Автовыключение света без движения'
  description: >-
    Раз в минуту: если в комнате горит свет (включён 30+ мин назад) и все её датчики движения
    30+ мин в состоянии «нет движения», свет комнаты выключается. Датчик не на связи — не выключать.
    Спальня (датчика нет): свет выключается, если горит 60+ мин. Детская — не трогать (решение пользователя).
    Кладовка — своя автоматизация.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/1"
  variables:
    minutes: 30
    rooms:
      - name: Кухня
        sensors: [binary_sensor.kukhnia_motion, binary_sensor.kukhnia_stol_motion]
        lights: [switch.light_kitchen_main, switch.light_kitchen_perimeter]
      - name: Зал
        sensors: [binary_sensor.zal_motion]
        lights: [light.zal_yeelight_hall, light.zal_yeelight_hall_ambilight]
      - name: Коридор
        sensors: [binary_sensor.koridor_motion]
        lights: [switch.light_corridor, switch.light_hall_main, switch.light_hall_perimeter]
      - name: Прихожая
        sensors: [binary_sensor.prikhozhaia_motion, binary_sensor.prikhozhaia_vkhod_motion]
        lights: [switch.light_entry_main, switch.light_entry_perimeter]
      - name: Ванная
        sensors: [binary_sensor.vannaia_motion]
        lights: [switch.light_bath, switch.light_bath_mirror]
      - name: Туалет
        sensors: [binary_sensor.tualet_motion]
        lights: [switch.light_wc]
      # Без датчиков движения: просто выключить, если свет горит дольше указанного времени.
      - name: Спальня
        sensors: []
        minutes: 60
        lights: [light.spalnia_yeelight_bed, light.spalnia_yeelight_bed_ambilight]
    to_off: >-
      {% set ns = namespace(out=[]) %}
      {% for r in rooms %}
        {% set limit = (r.minutes | default(minutes)) * 60 %}
        {% set q = namespace(quiet=true) %}
        {% for s in r.sensors %}
          {% set st = states[s.split('.')[0]][s.split('.')[1]] %}
          {% if st is none or st.state != 'off' or (now() - st.last_changed).total_seconds() < limit %}
            {% set q.quiet = false %}
          {% endif %}
        {% endfor %}
        {% if q.quiet %}
          {% for l in r.lights %}
            {% set ls = states[l.split('.')[0]][l.split('.')[1]] %}
            {% if ls is not none and ls.state == 'on' and (now() - ls.last_changed).total_seconds() >= limit %}
              {% set ns.out = ns.out + [l] %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {{ ns.out }}
  conditions:
    - condition: template
      value_template: "{{ to_off | count > 0 }}"
  actions:
    - action: homeassistant.turn_off
      target:
        entity_id: "{{ to_off }}"
- id: bath_mirror_on
  alias: 'Ванная: подсветка зеркала'
  description: >-
    Подсветка зеркала включается при открытии двери ванной или при движении в ванной — всегда, и ночью тоже.
    Выключает её общая автоматизация «Автовыключение света без движения» (комната Ванная).
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.vannaia_dver_contact
      from: "off"
      to: "on"
    # Без to/from: и на повторные события датчика, пока он уже в «on».
    - trigger: state
      entity_id: binary_sensor.vannaia_motion
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state == 'on'
           and trigger.from_state is not none
           and trigger.from_state.state not in ['unavailable', 'unknown'] }}
    - condition: state
      entity_id: switch.light_bath_mirror
      state: "off"
  actions:
    - action: switch.turn_on
      target: {entity_id: switch.light_bath_mirror}
